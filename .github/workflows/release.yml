name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag to publish with'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - beta

jobs:
  tag:
    name: Add/update 'latest' tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run latest-tag
        uses: EndBug/latest-tag@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Testing the lib
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      id-token: write  # Required for SLSA provenance
      attestations: write  # Required for build attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Run the test suite
        run: npm run test

      - name: Generate build attestation
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/**/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-npm:
    name: Publish on NPM
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write  # Required for NPM Trusted Publishers (OIDC) and provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js for NPM
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish to NPM
        run: |
          # This workflow is the npm Trusted Publisher (OIDC) for the package.
          # The OIDC exchange needs npm >= 11.5.1; Node 22 bundles npm 10.
          npm install -g npm@latest
          if [ "${{ inputs.npm_tag }}" == "beta" ]; then
            npm publish --tag beta --provenance --access public
          else
            npm publish --provenance --access public
          fi
        env:
          # Fallback auth; OIDC takes precedence when the Trusted Publisher is
          # configured on npmjs.com. Remove once an OIDC publish has succeeded.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

